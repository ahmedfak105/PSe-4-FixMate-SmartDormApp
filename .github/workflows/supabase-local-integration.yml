name: FixMate Full Local Supabase API Integration

on:
  push:
    paths:
      - '.github/workflows/supabase-local-integration.yml'
      - 'docs/sql/test/local_supabase_api_smoke.sh'
      - 'docs/sql/test/local_web_browser_smoke.cjs'
      - 'supabase/migrations/**'
  workflow_dispatch:

# Avoid simultaneous local Docker stacks on runners with shared daemon state.
concurrency:
  group: fixmate-local-supabase-${{ github.repository }}
  cancel-in-progress: true

jobs:
  local-supabase:
    name: Local Supabase Auth, Storage and RLS APIs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax before starting services
        run: bash -n docs/sql/test/local_supabase_api_smoke.sh

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '3.2.0'

      - name: Show CLI version and initialize isolated local project
        run: |
          supabase --version
          supabase init

      - name: Remove any stale isolated Supabase containers before startup
        run: supabase stop --no-backup || true
      - name: Start disposable local Supabase (Docker, no remote project)
        run: supabase start

      - name: Verify local database and install client if absent
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          PGPASSWORD=postgres psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT version();'

      - name: Rebuild a clean DB from committed Supabase CLI migrations
        run: |
          supabase migration list --local
          supabase db reset
      - name: Apply separately proposed validation and moderator SQL in local DB
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/PROPOSED_REPORT_INPUT_VALIDATION.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/PROPOSED_MODERATOR_REVIEW_MIGRATION.sql
          psql -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"

      - name: Test API with five freshly registered local accounts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          SUPABASE_URL: http://127.0.0.1:54321
        run: |
          supabase status -o env > "$RUNNER_TEMP/local_supabase.env"
          export SUPABASE_ANON_KEY="$(sed -n 's/^ANON_KEY=//p' "$RUNNER_TEMP/local_supabase.env" | tr -d '"')"
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo 'Could not read local anonymous key' >&2
            exit 1
          fi
          bash docs/sql/test/local_supabase_api_smoke.sh

      - name: Check out separate Admin/Staff/Moderator web branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-web-dashboard
          path: web-client
      - name: Setup Node.js for isolated browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium in runner
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/fixmate-browser" playwright@1.58.2
          "$RUNNER_TEMP/fixmate-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser E2E against local Supabase (no real users)
        env:
          SUPABASE_URL: http://127.0.0.1:54321
        run: |
          supabase status -o env > "$RUNNER_TEMP/local_supabase_browser.env"
          export SUPABASE_ANON_KEY="$(sed -n 's/^ANON_KEY=//p' "$RUNNER_TEMP/local_supabase_browser.env" | tr -d '"')"
          test -n "$SUPABASE_ANON_KEY"
          export NODE_PATH="$RUNNER_TEMP/fixmate-browser/node_modules"
          python3 -m http.server 5500 --bind 127.0.0.1 --directory web-client/admin-web > "$RUNNER_TEMP/fixmate_web_server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5500/index.html >/dev/null; then break; fi
            sleep 1
          done
          node docs/sql/test/local_web_browser_smoke.cjs
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup || true
