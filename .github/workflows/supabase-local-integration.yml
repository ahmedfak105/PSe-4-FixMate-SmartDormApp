name: FixMate Full Local Supabase API Integration

on:
  push:
    paths:
      - '.github/workflows/supabase-local-integration.yml'
      - 'docs/sql/test/local_supabase_api_smoke.sh'
  workflow_dispatch:

jobs:
  local-supabase:
    name: Local Supabase Auth, Storage and RLS APIs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax before starting services
        run: bash -n docs/sql/test/local_supabase_api_smoke.sh

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show CLI version and initialize isolated local project
        run: |
          supabase --version
          supabase init

      - name: Start disposable local Supabase (Docker, no remote project)
        run: supabase start

      - name: Verify local database and install client if absent
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          PGPASSWORD=postgres psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT version();'

      - name: Reconstruct baseline and proposed changes in disposable Supabase
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/VERIFIED_BASELINE_RECONSTRUCTION_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/VERIFIED_CATEGORY_SEED_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/PROPOSED_REPORT_INPUT_VALIDATION.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/PROPOSED_MODERATOR_REVIEW_MIGRATION.sql
          psql -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"

      - name: Test API with five freshly registered local accounts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          SUPABASE_URL: http://127.0.0.1:54321
        run: |
          supabase status -o env > "$RUNNER_TEMP/local_supabase.env"
          export SUPABASE_ANON_KEY="$(sed -n 's/^ANON_KEY=//p' "$RUNNER_TEMP/local_supabase.env" | tr -d '"')"
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo 'Could not read local anonymous key' >&2
            exit 1
          fi
          bash docs/sql/test/local_supabase_api_smoke.sh

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup || true
