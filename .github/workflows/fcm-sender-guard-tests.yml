name: FixMate FCM Sender Guard Tests

on:
  push:
    branches:
      - 'integration/**'
      - 'test/**'
    paths:
      - 'supabase/functions/send-report-push/**'
      - '.github/workflows/fcm-sender-guard-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/send-report-push/**'
      - '.github/workflows/fcm-sender-guard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-guards:
    name: Validate no-cost FCM security guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure webhook and FCM response tests (no credentials, no network)
        run: node --experimental-strip-types --test supabase/functions/send-report-push/push_guards_test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the complete server-only Edge Function (no credentials)
        run: deno check supabase/functions/send-report-push/index.ts
