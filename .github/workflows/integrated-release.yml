name: FixMate Integrated Release Candidate

on:
  push:
    branches:
      - 'integration/**'
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/**'
      - 'supabase/**'
      - '.github/workflows/integrated-release.yml'
  workflow_dispatch:

concurrency:
  group: fixmate-integration-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Verify one-repository delivery inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check resident/staff, web operations, backend, and lecturer evidence
        run: |
          set -eu
          test -f mobile/lib/main.dart
          test -f mobile/lib/features/reports/new_report_page.dart
          test -f mobile/lib/features/staff/staff_dashboard_page.dart
          test -f mobile/lib/features/operations/admin_operations_page.dart
          test -f mobile/lib/features/operations/moderator_operations_page.dart
          test -f mobile/OPERATIONS_WEB_README.md
          test -f docs/LECTURER_PRESENTATION_SCRIPT.md
          test -f docs/INTEGRATION_AND_DELIVERY_HANDOFF_2026-11-22.md
          test -f docs/FIXMATE_ERD.md
          test -f supabase/migrations/20261121222817_fixmate_baseline.sql
          test -f supabase/migrations/20261121222818_fixmate_categories_seed.sql
          test -f supabase/migrations/20261121223150_fixmate_fk_indexes.sql
          test -f supabase/migrations/20261122000339_fixmate_report_validation.sql
          test -f supabase/migrations/20261122000340_fixmate_moderator_review.sql
          test -f scripts/prepare_local_lecturer_demo.sh
          test -f docs/LOCAL_LECTURER_DEMO_RUNBOOK.md
          bash -n scripts/prepare_local_lecturer_demo.sh
          cmp docs/sql/PROPOSED_REPORT_INPUT_VALIDATION.sql supabase/migrations/20261122000339_fixmate_report_validation.sql
          cmp docs/sql/PROPOSED_MODERATOR_REVIEW_MIGRATION.sql supabase/migrations/20261122000340_fixmate_moderator_review.sql
          test -f docs/sql/PROPOSED_MODERATOR_REVIEW_MIGRATION.sql
          test -f docs/sql/PROPOSED_REPORT_INPUT_VALIDATION.sql

  flutter:
    name: Analyze and test the integrated Flutter app
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies and generate translations
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Dart analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter widget and unit tests
        run: flutter test

  android:
    name: Build integrated Android debug APK
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android debug app for offline demonstration
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fixmate-integrated-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build connected Android APK using public Supabase key
        env:
          FIXMATE_PUBLISHABLE_KEY: sb_publishable_eHEuMIdnI8vo1FAzXQmPow_zHrQTrXt
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://epsvagztisdovixlqehi.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$FIXMATE_PUBLISHABLE_KEY"
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fixmate-integrated-connected-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: Build integrated Flutter Web operations bundle
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build runtime-configurable Flutter Web
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build web --release --dart-define=FIXMATE_OPERATIONS_WEB=true
      - name: Verify compiled web files
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
      - uses: actions/upload-artifact@v4
        with:
          name: fixmate-integrated-flutter-web-operations
          path: mobile/build/web/
          if-no-files-found: error
          retention-days: 7
